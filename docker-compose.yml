services:
    web:
        build: .
        command: python /code/manage.py runserver 0.0.0.0:8000
        volumes:
            - .:/code
        ports:
            - 8000:8000
        depends_on:
            - db
        environment:
            - "DJANGO_SECRET_KEY=django-insecure-+0da7u#0$$4liyr^$$8$$iw%v(8m(11%ejty$$us)*!g+*)wdp&&c)"
            - "DJANGO_DEBUG=True"
    db:
        image: postgres:17-alpine
        volumes:
            - postgres_data:/var/lib/postgresql/data/
        environment:
            - "POSTGRES_HOST_AUTH_METHOD=trust"
volumes:
    postgres_data:
